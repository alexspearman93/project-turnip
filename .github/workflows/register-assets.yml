name: Asset Factory v0.3
on:
  push:
    branches: [main]
    paths:
      - 'assets/inbox/**'
      - 'tools/register_assets.py'
      - '.github/workflows/register-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: asset-factory-register-main
  cancel-in-progress: false
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate PNGs and refresh registry
        run: python3 tools/register_assets.py
      - name: Commit updated registry
        run: |
          if git diff --quiet -- assets/registry.json; then
            echo "Registry already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/registry.json
          git commit -m "Asset Factory: auto-register validated inbox assets"
          git push
