<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#233c2d"><title>Project Turnip</title><style>
*{box-sizing:border-box}body{margin:0;background:#17291e;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}#wrap{display:flex;flex-direction:column;align-items:center;height:100dvh;padding:8px;gap:6px}header{width:min(100%,560px);display:flex;justify-content:space-between;align-items:center;font-weight:800}header small{font-weight:500}canvas{width:min(100%,560px);height:auto;max-height:62dvh;aspect-ratio:4/3;image-rendering:pixelated;border:4px solid #6d5336;border-radius:8px;background:#80b85e}#bar{width:min(100%,560px);display:flex;gap:6px;justify-content:center;flex-wrap:wrap}button{border:2px solid #a2b37e;background:#314d35;color:white;border-radius:9px;padding:10px 12px;font-size:14px;font-weight:700;touch-action:none}button.active{background:#b9873c;border-color:#ffe0a1}#controls{width:min(100%,560px);display:flex;justify-content:space-between;align-items:center;flex:1;max-height:150px}.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,40px);gap:3px}.pad button{padding:0;font-size:23px}.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:3}.pad .right{grid-column:3;grid-row:2}#action{width:86px;height:86px;border-radius:50%;background:#b9873c;border:4px solid #ffe0a1;font-size:18px}#hint{font-size:12px;color:#c7d5bb;text-align:center;min-height:18px}#day{white-space:nowrap}
</style></head><body><div id="wrap"><header><span>🌱 PROJECT TURNIP</span><small id="day"></small></header><canvas id="game" width="512" height="384"></canvas><div id="bar"><button data-tool="hoe">⛏️ Hoe</button><button data-tool="seed">🌱 Seeds</button><button data-tool="water">💧 Water</button><button data-tool="harvest">🧺 Harvest</button><button id="sleep">🌙 Sleep</button></div><div id="controls"><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><button id="action">USE</button></div><div id="hint">Move with arrows, choose a tool, then USE.</div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=16,H=12,T=32,key='project-turnip-save-v1';
let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}
if(!state||!Array.isArray(state.tiles)||state.tiles.length!==W*H)state={x:8,y:6,facing:'down',day:1,coins:0,seeds:12,tiles:Array(W*H).fill(null).map(()=>({soil:false,seed:false,water:false,age:0}))};
let tool='hoe';const hint=document.getElementById('hint'),dayEl=document.getElementById('day');
function save(){localStorage.setItem(key,JSON.stringify(state))}function info(s){hint.textContent=s}function tile(x,y){return state.tiles[y*W+x]}
function update(){dayEl.textContent='Day '+state.day+' · 🪙 '+state.coins+' · 🌱 '+state.seeds;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));save();draw()}
function move(dir){state.facing=dir;const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];state.x=Math.max(0,Math.min(W-1,state.x+d[0]));state.y=Math.max(0,Math.min(H-1,state.y+d[1]));update()}
function use(){const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[state.facing],x=state.x+d[0],y=state.y+d[1];if(x<0||x>=W||y<0||y>=H){info('Face a tile inside the farm.');return}const t=tile(x,y);
if(tool==='hoe'){if(!t.soil){t.soil=true;info('Freshly tilled soil!')}else info('Already tilled.')}
if(tool==='seed'){if(!t.soil)info('Till this tile first.');else if(t.seed)info('Something is already growing.');else if(state.seeds<1)info('Out of seeds! Harvest crops to earn more.');else{t.seed=true;t.age=0;t.water=false;state.seeds--;info('Turnip planted!')}}
if(tool==='water'){if(t.seed){t.water=true;info('Watered! Sleep to grow your crops.')}else info('Plant something here first.')}
if(tool==='harvest'){if(t.seed&&t.age>=3){t.seed=false;t.age=0;t.water=false;state.coins+=10;state.seeds+=2;info('Turnip harvested! +10 coins, +2 seeds.')}else info('No ripe turnip here yet.')}
update()}
function sleep(){state.day++;let grown=0;for(const t of state.tiles){if(t.seed&&t.water&&t.age<3){t.age++;grown++}t.water=false}info('Good morning! '+grown+' crops grew. Water again today.');update()}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function draw(){for(let y=0;y<H;y++)for(let x=0;x<W;x++){const px=x*T,py=y*T,t=tile(x,y),n=(x*17+y*31)%7;rect(px,py,T,T,(x+y)%2?'#83b95e':'#8dc368');if(n===0){rect(px+6,py+8,3,3,'#659d4b');rect(px+22,py+23,3,3,'#659d4b')}if(t.soil){rect(px+2,py+2,28,28,'#85583a');rect(px+5,py+6,22,3,'#9d6a46');rect(px+5,py+17,22,3,'#9d6a46')}if(t.water){rect(px+3,py+3,26,26,'#665f58');rect(px+8,py+23,5,3,'#70b9db')}if(t.seed){const cx=px+16,cy=py+17;if(t.age===0){rect(cx-2,cy+5,4,5,'#4d8a3e');rect(cx-6,cy+1,6,4,'#4a963d')}else if(t.age<3){rect(cx-2,cy-3,4,16,'#377b34');rect(cx-10,cy-5,10,6,'#4c9c3e');rect(cx+1,cy-9,9,7,'#62b548')}else{rect(cx-8,cy+2,16,13,'#eee5e4');rect(cx-5,cy+12,10,4,'#e5d6d6');rect(cx-3,cy-9,6,13,'#3f963f');rect(cx-12,cy-8,11,8,'#60b84b');rect(cx+2,cy-12,11,9,'#57ae45')}}}
const p=state,px=p.x*T,py=p.y*T;rect(px+9,py+24,15,5,'#4b7240');rect(px+9,py+13,14,14,'#3d658b');rect(px+7,py+9,18,12,'#e4ae7c');rect(px+6,py+5,20,6,'#6e4734');rect(px+10,py+1,12,6,'#95633d');rect(px+11,py+14,3,3,'#392b27');rect(px+20,py+14,3,3,'#392b27');const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[p.facing],tx=p.x+d[0],ty=p.y+d[1];if(tx>=0&&tx<W&&ty>=0&&ty<H){ctx.strokeStyle='#fff4b3';ctx.lineWidth=2;ctx.strokeRect(tx*T+2,ty*T+2,28,28)}}
document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.tool;update()}));document.querySelectorAll('[data-dir]').forEach(b=>{let timer,delay;b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.dir);delay=setTimeout(()=>{timer=setInterval(()=>move(b.dataset.dir),115)},230)});const stop=()=>{clearTimeout(delay);clearInterval(timer)};b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('pointerleave',stop)});document.getElementById('action').addEventListener('click',use);document.getElementById('sleep').addEventListener('click',sleep);document.addEventListener('keydown',e=>{const dir={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(dir){e.preventDefault();move(dir)}else if(e.key===' '){e.preventDefault();use()}});update();
</script></body></html>
