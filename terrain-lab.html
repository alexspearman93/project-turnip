<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Turnip | Terrain Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17231b;color:#f1ecd8;font:16px system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:20px}h1{font-size:1.55rem;margin-bottom:4px}p{line-height:1.45;color:#c4d2bb}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border:2px solid #52694b;border-radius:8px;background:#34512e}button,input{font:inherit;padding:10px;border-radius:8px}button{background:#c1d68a;color:#17231b;border:0;font-weight:600}input[type=number]{width:138px;background:#27372a;color:white;border:1px solid #687f65}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:16px 0}.controls label{display:flex;gap:6px;align-items:center}small{color:#b8c7af}a{color:#c1d68a}.status{margin-top:12px;font-size:.9rem}
</style></head><body><main><h1>🌱 Project Turnip — Terrain Lab</h1>
<p>Live procedural terrain playground. This is a <strong>browser approximation</strong>, not yet the A002 artwork-quilting engine.</p>
<div class="controls"><label>Seed <input id="seed" type="number" value="20261108"></label><button id="generate">Generate</button><button id="random">New seed</button><button id="save">Save PNG</button><label><input id="grid" type="checkbox"> Tile grid</label></div>
<canvas id="canvas" width="512" height="384" aria-label="Generated terrain preview"></canvas><p id="status" class="status" role="status"></p>
<small>512 × 384 · 32px logical tiles · deterministic seed · experimental preview only · <a href="./">Back to game</a></small>
</main><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');
function hash(x,y,s){let n=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(s,1442695041);n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295}
function noise(x,y,s,z){let a=x/z,b=y/z,i=Math.floor(a),j=Math.floor(b),u=a-i,v=b-j;u=u*u*(3-2*u);v=v*v*(3-2*v);return (hash(i,j,s)*(1-u)+hash(i+1,j,s)*u)*(1-v)+(hash(i,j+1,s)*(1-u)+hash(i+1,j+1,s)*u)*v}
function draw(){const seed=Number(document.getElementById('seed').value)||0,data=ctx.createImageData(512,384);for(let y=0;y<384;y++)for(let x=0;x<512;x++){const center=225+Math.sin(x/83+((seed%13+13)%13))*38+Math.sin(x/39)*15,dist=Math.abs(y-center)+(noise(x,y,seed+3,29)-.5)*23,path=23+noise(x,y,seed+5,70)*14,forest=y<76+noise(x,y,seed+9,105)*82,kind=dist<path?2:forest?1:0,n=noise(x,y,seed+17,9),f=hash(x>>1,y>>1,seed+23),colors=[[63,113,41],[82,84,34],[154,105,64]],rgb=colors[kind].map(v=>Math.max(0,Math.min(255,Math.round(v+(n-.5)*45+(f-.5)*22)))),p=(y*512+x)*4;data.data[p]=rgb[0];data.data[p+1]=rgb[1];data.data[p+2]=rgb[2];data.data[p+3]=255}ctx.putImageData(data,0,0);if(document.getElementById('grid').checked){ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<=512;x+=32){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,384)}for(let y=0;y<=384;y+=32){ctx.moveTo(0,y+.5);ctx.lineTo(512,y+.5)}ctx.stroke()}document.getElementById('status').textContent='Rendered seed '+seed+' · experimental browser preview'}
document.getElementById('generate').onclick=draw;document.getElementById('grid').onchange=draw;document.getElementById('random').onclick=()=>{document.getElementById('seed').value=Math.floor(Math.random()*1000000000);draw()};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='turnip-terrain-preview.png';a.href=c.toDataURL('image/png');a.click()};draw();
</script></body></html>
