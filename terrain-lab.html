<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turnip Real-Art Terrain Lab</title><style>body{background:#16231a;color:#f2efdc;font:16px system-ui;margin:0}main{max-width:960px;margin:auto;padding:18px}p{color:#c4d0bf;line-height:1.5}button{background:#304832;color:white;border:1px solid #8b9f7d;border-radius:8px;padding:11px;margin:3px;font:inherit}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.pane{min-width:0}.imagebox{position:relative}.imagebox img{width:100%;image-rendering:pixelated;border:1px solid #8b9f7d;border-radius:6px}.grid{position:absolute;inset:0;pointer-events:none;display:none;background-size:6.25% 8.333333%;background-image:linear-gradient(to right,#ffffff66 1px,transparent 1px),linear-gradient(to bottom,#ffffff66 1px,transparent 1px)}.showgrid .grid{display:block}a{color:#c9eaa0}</style></head><body><main><h1>🌱 Turnip Terrain Lab — A002 Real Artwork</h1><p>Actual Python-generated A002 terrain previews. Fixed seeds, candidate artwork only — not approved game assets.</p><div><button id="gridBtn">Show 32px grid</button><button id="swap">Swap sides</button><button id="save">Save left PNG</button></div><section class="gallery"><div class="pane"><h2 id="la">Seed 20261108</h2><div class="imagebox"><img id="a" src="terrain-previews/a002_seed_20261108.png" alt="A002 terrain seed 20261108"><div class="grid"></div></div></div><div class="pane"><h2 id="lb">Seed 20261109</h2><div class="imagebox"><img id="b" src="terrain-previews/a002_seed_20261109.png" alt="A002 terrain seed 20261109"><div class="grid"></div></div></div></section><p id="status" role="status"></p><p><a href="./">Return to Project Turnip</a></p></main><script>const paths={20261108:'terrain-previews/a002_seed_20261108.png',20261109:'terrain-previews/a002_seed_20261109.png'};let left=20261108,right=20261109;function render(){document.querySelector('#a').src=paths[left];document.querySelector('#b').src=paths[right];document.querySelector('#la').textContent='Seed '+left;document.querySelector('#lb').textContent='Seed '+right}document.querySelector('#gridBtn').onclick=()=>{let v=document.body.classList.toggle('showgrid');document.querySelector('#gridBtn').textContent=v?'Hide 32px grid':'Show 32px grid'};document.querySelector('#swap').onclick=()=>{[left,right]=[right,left];render()};document.querySelector('#save').onclick=()=>{let a=document.createElement('a');a.href=paths[left];a.download='turnip_a002_seed_'+left+'.png';a.click()};document.querySelectorAll('img').forEach(i=>i.onerror=()=>document.querySelector('#status').textContent='Image missing: deploy the terrain-previews PNG files alongside this page.');render()</script></body></html>
